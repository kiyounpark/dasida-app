<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" fill="#ffffff"/>
  <g fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== 아래 가운데: 받는 사람 (큰 얼굴, > < 눈, 땀, 두 손 들어올림) ===== -->
    <path d="M500 730 q-70 4 -74 70 q-4 70 68 74 q72 4 78 -66 q4 -74 -72 -78 z"/>
    <!-- 눈 > < -->
    <path d="M458 790 l16 10 l-16 10"/>
    <path d="M542 790 l-16 10 l16 10"/>
    <!-- 입: 물결 -->
    <path d="M470 840 q10 -8 20 0 q10 8 20 0 q10 -8 20 0"/>
    <!-- 땀 한 방울 -->
    <path d="M584 736 q-12 16 0 30 q12 -12 0 -30 z"/>
    <!-- 어깨 -->
    <path d="M410 900 q90 -30 180 0"/>
    <!-- 왼손 들어올림 (팔 + 손바닥) -->
    <path d="M420 885 q-60 -60 -50 -170"/>
    <path d="M370 715 q-22 -6 -26 -26 q8 -18 26 -14 q18 6 20 26 q-4 16 -20 14 z"/>
    <!-- 오른손 들어올림 -->
    <path d="M580 885 q60 -60 50 -170"/>
    <path d="M630 715 q22 -6 26 -26 q-8 -18 -26 -14 q-18 6 -20 26 q4 16 20 14 z"/>

    <!-- ===== 위 3명 (동그라미 얼굴, 눈 점 두 개, 확신에 찬 입) ===== -->
    <!-- 왼쪽 -->
    <path d="M180 230 q-60 4 -64 60 q-4 60 58 64 q62 4 68 -56 q4 -64 -62 -68 z"/>
    <path d="M158 280 l3 3 M202 280 l3 3"/>
    <path d="M166 312 q16 6 32 0"/>
    <path d="M130 360 q50 -20 100 0"/>
    <!-- 가운데 -->
    <path d="M500 190 q-60 4 -64 60 q-4 60 58 64 q62 4 68 -56 q4 -64 -62 -68 z"/>
    <path d="M478 240 l3 3 M522 240 l3 3"/>
    <path d="M486 272 q16 6 32 0"/>
    <path d="M450 320 q50 -20 100 0"/>
    <!-- 오른쪽 -->
    <path d="M820 230 q-60 4 -64 60 q-4 60 58 64 q62 4 68 -56 q4 -64 -62 -68 z"/>
    <path d="M798 280 l3 3 M842 280 l3 3"/>
    <path d="M806 312 q16 6 32 0"/>
    <path d="M770 360 q50 -20 100 0"/>

    <!-- ===== 세 팔 + 연필 3자루, 전부 아래 사람한테 들이밈 ===== -->
    <!-- 왼쪽 팔 (어깨 → 손) -->
    <path d="M220 370 q70 100 165 165"/>
    <g transform="translate(395 545) rotate(-40)">
      <!-- 연필: 지우개(위) → 몸통 → 촉(아래) -->
      <path d="M-14 -86 q14 -4 28 0 l0 16 l-28 0 z"/>
      <path d="M-14 -70 l2 130 M14 -70 l-2 130"/>
      <path d="M-12 60 l12 40 l12 -40"/>
      <!-- 주먹 -->
      <path d="M0 -6 q-20 2 -22 20 q4 18 22 20 q18 -2 22 -20 q-2 -18 -22 -20 z"/>
    </g>

    <!-- 가운데 팔 (곧게 아래로) -->
    <path d="M500 330 q4 90 0 190"/>
    <g transform="translate(500 520)">
      <path d="M-14 -86 q14 -4 28 0 l0 16 l-28 0 z"/>
      <path d="M-14 -70 l2 130 M14 -70 l-2 130"/>
      <path d="M-12 60 l12 40 l12 -40"/>
      <path d="M0 -6 q-20 2 -22 20 q4 18 22 20 q18 -2 22 -20 q-2 -18 -22 -20 z"/>
    </g>

    <!-- 오른쪽 팔 -->
    <path d="M780 370 q-70 100 -165 165"/>
    <g transform="translate(605 545) rotate(40)">
      <path d="M-14 -86 q14 -4 28 0 l0 16 l-28 0 z"/>
      <path d="M-14 -70 l2 130 M14 -70 l-2 130"/>
      <path d="M-12 60 l12 40 l12 -40"/>
      <path d="M0 -6 q-20 2 -22 20 q4 18 22 20 q18 -2 22 -20 q-2 -18 -22 -20 z"/>
    </g>

    <!-- ===== 말풍선 3개: 내용은 서로 다름 (글자 없음) ===== -->
    <!-- 왼쪽 풍선: 전구 = "발상만 적어라" -->
    <path d="M100 70 q70 -8 140 0 q10 34 0 68 q-40 4 -80 0 l-18 26 l-4 -26 q-20 2 -38 0 q-8 -34 0 -68 z"/>
    <path d="M170 82 q-22 2 -24 24 q2 14 12 22 l0 10 l24 0 l0 -10 q10 -8 12 -22 q-2 -22 -24 -24 z"/>
    <path d="M162 146 l16 0"/>

    <!-- 가운데 풍선: 긴 줄 셋 → 한 줄 = "한 줄로 줄여라" -->
    <path d="M420 30 q70 -8 140 0 q10 34 0 68 q-40 4 -80 0 l-14 26 l-6 -26 q-20 2 -40 0 q-8 -34 0 -68 z"/>
    <path d="M440 50 q30 -2 60 0 M440 64 q30 -2 60 0 M440 78 q30 -2 60 0"/>
    <path d="M510 64 l16 0 M526 64 l-8 -6 M526 64 l-8 6"/>
    <path d="M536 64 q12 -2 24 0"/>

    <!-- 오른쪽 풍선: 노트 한 장 = "네가 적어라" -->
    <path d="M740 70 q70 -8 140 0 q10 34 0 68 q-40 4 -80 0 l-10 26 l-10 -26 q-20 2 -40 0 q-8 -34 0 -68 z"/>
    <path d="M790 82 q30 -2 60 0 q4 26 0 52 q-30 -2 -60 0 q-4 -26 0 -52 z"/>
    <path d="M800 96 q20 -2 40 0 M800 108 q20 -2 40 0 M800 120 q14 -2 28 0"/>
  </g>
</svg>

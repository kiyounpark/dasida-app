<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" fill="#ffffff"/>
  <g fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- 큰 순환 화살표 3토막 (시계 방향) -->
    <!-- 위(노트) → 오른쪽 아래(지친 얼굴) -->
    <path d="M640 250 q150 60 170 220 q6 60 -20 120"/>
    <path d="M790 590 l-30 -50 M790 590 l50 -30"/>
    <!-- 오른쪽 아래 → 왼쪽 아래(덮은 노트) -->
    <path d="M700 800 q-200 60 -400 0"/>
    <path d="M300 800 l55 -25 M300 800 l52 32"/>
    <!-- 왼쪽 아래 → 위(노트) -->
    <path d="M210 590 q-30 -160 60 -260 q40 -50 90 -80"/>
    <path d="M360 250 l-58 -4 M360 250 l-28 52"/>

    <!-- 위: 펼친 노트 + 연필 -->
    <path d="M400 150 q50 -8 100 0 q50 -8 100 0 q6 60 0 120 q-50 -8 -100 0 q-50 -8 -100 0 q-6 -60 0 -120 z"/>
    <path d="M500 150 q4 60 0 120"/>
    <path d="M420 185 q30 -3 60 0 M420 215 q30 -3 60 0 M420 245 q20 -2 40 0"/>
    <path d="M600 120 l70 -60 M600 120 l14 14 l70 -60 l-14 -14 M600 120 l-10 24 l24 -10"/>

    <!-- 오른쪽 아래: 지친 얼굴 (동그라미, 눈 ><, 땀) -->
    <path d="M800 640 q-70 6 -76 70 q-4 66 66 76 q72 6 82 -62 q6 -76 -72 -84 z"/>
    <path d="M770 690 l16 10 l-16 10 M840 690 l-16 10 l16 10"/>
    <path d="M785 740 q20 -8 40 0"/>
    <path d="M880 650 q-14 20 0 34 q14 -14 0 -34 z"/>

    <!-- 왼쪽 아래: 쓰레기통 + 반쯤 꽂힌 노트 -->
    <path d="M110 690 q90 -6 180 0"/>
    <path d="M122 692 q6 70 14 140 q68 6 128 0 q8 -70 14 -140"/>
    <path d="M140 720 q4 50 6 90 M200 722 q0 50 0 90 M258 720 q-4 50 -6 90"/>
    <!-- 노트가 비스듬히 꽂힘 -->
    <path d="M150 700 l40 -90 q40 -6 76 4 l-28 86"/>
    <path d="M172 662 q30 -4 58 2 M180 640 q30 -4 58 2"/>
    <!-- 통 위로 튀는 선 -->
    <path d="M110 650 l-16 -24 M300 650 l16 -24"/>
  </g>
</svg>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>다시다 — 틀린 문제, 왜 틀렸는지 알려줌</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream: #FBF7EF;
    --cream-2: #F3ECDD;
    --green: #1F3B30;
    --green-soft: #2E5344;
    --ink: #26221B;
    --muted: #7A7263;
    --line: #E4DAC6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: "SUIT", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .wrap { width: 100%; max-width: 480px; padding: 40px 22px 60px; }
  .brand { font-size: 15px; font-weight: 800; color: var(--green); letter-spacing: -0.2px; }
  h1 { font-size: 26px; font-weight: 800; line-height: 1.35; letter-spacing: -0.5px; margin: 22px 0 10px; }
  h1 .hl { color: var(--green); }
  .sub { font-size: 15px; line-height: 1.6; color: var(--muted); margin: 0 0 28px; }
  .drop {
    border: 1.5px dashed var(--line); background: #fff; border-radius: 18px;
    padding: 40px 20px; text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--green-soft); background: var(--cream-2); }
  .drop .icon { font-size: 34px; }
  .drop .big { font-size: 16px; font-weight: 700; margin-top: 12px; }
  .drop .small { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .picked { display: none; margin-top: 14px; font-size: 14px; font-weight: 700; color: var(--green); }
  .steps { margin: 30px 0 0; padding: 0; list-style: none; }
  .steps li {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 14px 0; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.5;
  }
  .steps li .n {
    flex: 0 0 22px; height: 22px; border-radius: 50%;
    background: var(--green); color: #fff; font-size: 12px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .cta {
    display: block; width: 100%; margin-top: 26px;
    background: var(--green); color: #fff; border: 0; border-radius: 14px;
    padding: 16px; font-size: 16px; font-weight: 800; cursor: pointer;
    opacity: .45; pointer-events: none; transition: opacity .15s; font-family: inherit;
  }
  .cta.ready { opacity: 1; pointer-events: auto; }
  .foot { margin-top: 18px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.5; }
  .tag { display:inline-block; font-size:11px; font-weight:700; color:var(--green-soft); background:var(--cream-2); border:1px solid var(--line); border-radius:999px; padding:4px 10px; }

  /* --- 채팅 화면 --- */
  .screen[hidden] { display: none; }
  .thread { display: flex; flex-direction: column; gap: 10px; padding: 8px 0 24px; }
  .bubble { max-width: 88%; padding: 12px 14px; border-radius: 16px; font-size: 15px; line-height: 1.55; white-space: pre-wrap; }
  .bubble.coach { background: #fff; border: 1px solid var(--line); align-self: flex-start; border-top-left-radius: 4px; }
  .bubble.me { background: var(--green); color: #fff; align-self: flex-end; border-top-right-radius: 4px; }
  /* 한 덩어리 안의 문단 — 생각이 바뀌는 자리만 벌린다 (말풍선을 쪼개지 않는다) */
  .bubble .p { display: block; }
  .bubble .p + .p { margin-top: 9px; }
  /* 답할 차례인 말풍선: 폭·바탕·테두리로 "여기 네가 답한다"를 읽기 전에 알게 한다 */
  .bubble.coach.ask {
    align-self: stretch; max-width: 100%;
    background: var(--cream-2); border: 1.5px solid var(--green-soft);
    border-bottom-left-radius: 4px; border-top-left-radius: 16px;
  }
  .bubble.coach.ask .p:last-child { font-weight: 700; color: var(--green); }
  /* 수식 — 배경도 테두리도 없이 서체만 바꾼다. 말풍선은 조용하게, 숫자만 읽히게. */
  .m {
    font-family: "Noto Serif KR", Georgia, "Apple SD Gothic Neo", serif;
    font-weight: 600; font-size: 1.12em; color: var(--green);
    letter-spacing: 0.2px; overflow-wrap: anywhere;
  }
  .m sub { font-size: 0.7em; }
  /* 내 말풍선: 진한 초록 바탕에서 세리프 600은 획이 사라진다 — 굵기와 크기를 올린다 */
  .bubble.me .m { color: #fff; font-weight: 700; font-size: 1.18em; letter-spacing: 0.4px; }
  .bubble.me .m sub { font-size: 0.72em; }
  .bubble.me .m.q { background: rgba(255,255,255,0.16); border: 0; }
  /* 인용부호 안의 수식 = "네가 쓴 그 줄" — 여기서만 바탕을 깔아 한 번 더 잡는다 */
  .m.q { background: var(--cream-2); border-radius: 5px; padding: 1px 5px; }
  .bubble.coach.ask .m.q, .card.final .m.q { background: #fff; border: 1px solid var(--line); }
  /* 문단 전체가 수식이면 제 줄에 크게 — 긴 식은 360px에서 가로 스크롤 */
  .bubble .p.math-line {
    border-left: 3px solid var(--green-soft); border-radius: 0 8px 8px 0;
    background: var(--cream); padding: 9px 12px; font-size: 19px;
    overflow-x: auto; white-space: nowrap;
  }
  .bubble.coach.ask .p.math-line { background: #fff; }
  .bubble .p.math-line .m { font-size: 1em; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .card .card-title { font-weight: 800; font-size: 15px; margin-bottom: 6px; }
  .card .card-body { font-size: 14px; line-height: 1.6; color: var(--ink); white-space: pre-line; }
  .card.final { border-color: var(--green-soft); background: var(--cream-2); }
  .curve-card { width: 100%; }
  .curve-card svg { display: block; width: 100%; max-width: 100%; height: auto; }
  .curve-marks { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  .curve-marks li { display: flex; gap: 9px; align-items: flex-start; font-size: 13px; line-height: 1.5; }
  .curve-marks .n {
    flex: 0 0 20px; height: 20px; border-radius: 50%;
    background: var(--green); color: #fff; font-size: 11px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .curve-marks .n.dim { background: var(--muted); }
  /* --- 오답노트 카드: "완성된 노트 한 장"으로 보이게 (07.31) --- */
  .note-card { width: 100%; border-color: var(--green-soft); background: #fff; }
  .note-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .note-title { font-weight: 800; font-size: 15px; color: var(--green); }
  .note-date { font-size: 12px; color: var(--muted); font-weight: 700; }
  /* contain: 세로로 긴 시험지 사진도 통째로 — cover는 인용한 그 손글씨 줄을 잘라먹는다 */
  .note-photo { display: block; width: 100%; max-height: 240px; object-fit: contain; background: var(--cream-2); border-radius: 10px; border: 1px solid var(--line); margin-bottom: 10px; }
  .note-row { display: flex; gap: 10px; padding: 8px 0; border-top: 1px dashed var(--line); font-size: 14px; line-height: 1.55; }
  .note-label { flex: 0 0 96px; font-weight: 800; font-size: 13px; color: var(--green-soft); }
  /* min-width:0 + anywhere: 안 끊기는 긴 수식 토큰이 카드 밖으로 삐져나가지 않게 */
  .note-row > span:last-child { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .note-foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12.5px; font-weight: 700; color: var(--ink); }
  .note-tags { color: var(--green-soft); }
  .note-capture { margin-top: 10px; font-size: 12px; color: var(--muted); text-align: center; }
  .actions { display: flex; flex-direction: column; gap: 8px; padding: 6px 0 30px; }
  .actions button {
    border: 1.5px solid var(--green-soft); background: #fff; color: var(--green);
    border-radius: 12px; padding: 13px 14px; font-size: 15px; font-weight: 700;
    cursor: pointer; font-family: inherit; text-align: left;
  }
  .actions button.primary { background: var(--green); color: #fff; border-color: var(--green); }
  .actions button.ghost { border-color: var(--line); color: var(--muted); font-weight: 500; }
  .spinner { text-align: center; padding: 60px 0; color: var(--muted); font-size: 15px; }
  /* 문구가 바뀔 때 글자가 튀지 않게 — 두 줄짜리가 와도 자리를 미리 잡아둔다 */
  .spinner-step { min-height: 44px; transition: opacity .25s; }
  .spinner-note { margin-top: 10px; font-size: 13px; opacity: .7; }
  .fallback-input { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 13px; font-size: 15px; font-family: inherit; }
</style>
</head>
<body>
  <main class="wrap">
    <div class="brand">다시다</div>

    <!-- 화면 1: 업로드 -->
    <section class="screen" id="screen-upload">
      <h1>틀린 문제만 찍어서 올려줘<br /><span class="hl">왜 틀렸는지</span> 알려줄게</h1>
      <p class="sub">채점은 이미 했잖아. 틀린 문제 하나, 풀이 흔적까지 나오게 찍으면 돼.</p>
      <div class="drop" id="drop">
        <div class="icon">📸</div>
        <div class="big">틀린 문제 사진 올리기</div>
        <div class="small">풀이 쓴 부분까지 한 장에 나오게</div>
        <div class="picked" id="picked"></div>
        <input type="file" id="file" accept="image/*" hidden />
      </div>
      <ol class="steps">
        <li><span class="n">1</span><span>틀린 문제 하나를 풀이까지 나오게 찍는다</span></li>
        <li><span class="n">2</span><span>AI가 풀이를 읽고 어디서 막혔는지 찾는다</span></li>
        <li><span class="n">3</span><span>질문 몇 개로 확정한다 — 오답노트 한 장이 나온다</span></li>
      </ol>
      <button class="cta" id="cta">분석 시작</button>
      <p class="foot"><span class="tag">지금 무료</span><br />설치·로그인 없음 · 사진은 AI 분석에만 사용, 우리 서버에는 저장 안 함</p>
    </section>

    <!-- 화면 2: 분석 중 -->
    <section class="screen" id="screen-analyzing" hidden>
      <div class="spinner">
        <div class="spinner-step" id="analyzing-step">사진에서 네 손글씨 읽는 중…</div>
        <div class="spinner-note">15초 정도 걸려</div>
      </div>
    </section>

    <!-- 화면 3: 진단 대화 -->
    <section class="screen" id="screen-chat" hidden>
      <div class="thread" id="thread"></div>
      <div class="actions" id="actions"></div>
    </section>
  </main>
  <!-- analytics는 app.js보다 먼저 — window.track이 정의돼야 logEvent가 실제로 쏜다 (defer는 순서 보장) -->
  <script src="./analytics.js" defer></script>
  <script src="./flow-bundle.js" defer></script>
  <script src="./survey-data.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
